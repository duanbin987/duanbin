server:
  port: 8080

spring:
  datasource:
    # MySQL 5.7：JDBC 驱动 8.x 可连接 5.7 服务端
    url: jdbc:mysql://localhost:3306/feihua_poetry?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: feihua-poetry-jwt-secret-key-2024-very-long-string
  expiration: 86400000

cors:
  # 开发环境 Vite 端口不固定（5173/5174/5175…），使用 pattern 匹配
  allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
